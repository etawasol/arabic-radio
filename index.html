<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الإذاعات العربية">
<title>الإذاعات العربية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="bar">
    <div class="brand">
      <img src="icons/icon-64.png" alt="" width="34" height="34">
      <div><h1>الإذاعات العربية</h1><small id="count"></small></div>
    </div>
    <input id="q" class="search" type="search" placeholder="ابحث باسم المحطة أو الدولة…" autocomplete="off" enterkeyhint="search">
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="all" class="on">الكل</button>
    <button data-view="fav">★ المفضلة</button>
    <button data-view="recent">🕘 استمعت مؤخراً</button>
  </nav>
  <div class="chips" id="cats"></div>
  <button class="country-toggle" id="countryToggle" aria-expanded="false"><span id="countryLabel">🌍 كل الدول</span> ▾</button>
  <div class="chips wrap" id="countries"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<div class="player" id="player" hidden>
  <div class="np">
    <div class="logo" id="npLogo"></div>
    <div class="meta">
      <div class="name" id="npName">—</div>
      <div class="status" id="npStatus"><i></i><span>متوقف</span></div>
    </div>
  </div>
  <div class="ctrls">
    <button class="round" id="prevBtn" aria-label="المحطة السابقة">⏭</button>
    <button class="round big" id="playBtn" aria-label="تشغيل أو إيقاف">▶</button>
    <button class="round" id="nextBtn" aria-label="المحطة التالية">⏮</button>
  </div>
  <div class="extras">
    <button class="pill" id="favBtn" aria-label="إضافة للمفضلة">☆</button>
    <button class="pill" id="sleepBtn" aria-label="مؤقت النوم">🌙 <span id="sleepLabel">مؤقت</span></button>
    <label class="vol">🔈<input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="مستوى الصوت"></label>
  </div>
</div>

<div class="sheet" id="sleepSheet" hidden>
  <div class="sheet-body">
    <h3>إيقاف التشغيل بعد</h3>
    <div class="sheet-opts">
      <button data-min="15">15 دقيقة</button><button data-min="30">30 دقيقة</button>
      <button data-min="60">ساعة</button><button data-min="90">ساعة ونصف</button>
      <button data-min="0" class="off">إلغاء المؤقت</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="none" playsinline x-webkit-airplay="allow"></audio>
<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
